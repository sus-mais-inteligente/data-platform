[theme]
base = "light"
primaryColor = "#387C71"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#F2EFE8"
textColor = "#24292B"
borderColor = "#DEDAD1"
dataframeBorderColor = "#DEDAD1"
linkColor = "#387C71"
linkUnderline = false
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Schibsted Grotesk:https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&display=swap"
headingFontSizes = ["2.25rem", "1.75rem", "1.375rem"]
headingFontWeights = 600
chartCategoricalColors = [
    "#4BA696",
    "#377E8D",
    "#C54F4C",
    "#7B8794",
    "#58C09C",
    "#A38B6D",
    "#5C6B73",
]
